[rf]
tx_gain = 80
rx_gain = 40
device_name = zmq
device_args = tx_port=tcp://*:2001,rx_port=tcp://localhost:2000,id=ue,base_srate=23.04e6

[rat.eutra]
dl_earfcn = 3350
nof_carriers = 1


[usim]
mode = soft
algo = milenage
imsi = 001010000000002
k    = 7C5FA3F23483E17704D5E2F18175D81E
opc  = 78B49A111AEC4EB48C3C4BDCF915A17A

[nas]
apn = internet
apn_protocol = ipv4

[gw]
ip_devname = tun_srsue
ip_netmask = 255.255.255.0
netns = ue1

[log]
all_level = info
filename = /tmp/ue.log


