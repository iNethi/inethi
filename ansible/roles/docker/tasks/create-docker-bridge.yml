---
- name: Check if Docker is installed
  command: docker --version
  register: docker_installed

- name: Check if Docker network exists
  docker_network:
    name: "{{ BRIDGE }}"
  register: network_check
  ignore_errors: yes

- name: Create the Docker network
  docker_network:
    name: "{{ BRIDGE }}"
    driver: bridge
    attachable: yes
  when: network_check is failed