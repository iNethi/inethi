- name: Create Docker volumes for Radiusdesk
  docker_volume:
    name: rd_data
    state: present

- name: Start Radiusdesk database Docker Container
  docker_container:
    name: rdmariadb
    image: docker.io/bitnami/mariadb:latest
    restart_policy: unless-stopped
    state: started
    volumes:
      - "{{ DATA_MOUNT }}/radiusdesk/db_conf/my_custom.cnf:/opt/bitnami/mariadb/conf/my_custom.cnf:ro"
      - "{{ DATA_MOUNT }}/radiusdesk/db_startup:/docker-entrypoint-initdb.d:ro"
      - "rd_data:/bitnami/mariadb"
    env:
      ALLOW_EMPTY_PASSWORD: "yes"
      MARIADB_ROOT_PASSWORD: "{{ RADIUSDESK_DB_ROOT_PASSWORD }}"
      MARIADB_USER: "{{ RADIUSDESK_DB_USER }}"
      MARIADB_PASSWORD: "{{ RADIUSDESK_DB_PASSWORD }}"
      MARIADB_DATABASE: "{{ RADIUSDESK_DB_NAME }}"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-u",
          "root",
          "-p{{ RADIUSDESK_DB_ROOT_PASSWORD }}",
        ]
      interval: "10s"
      timeout: "5s"
      retries: 5
    networks:
      - name: "{{ BRIDGE }}"

- name: Wait for MariaDB container to be healthy
  docker_container_info:
    name: rdmariadb
  register: mariadb_info
  until: mariadb_info.container.State.Health.Status == 'healthy'
  retries: 10
  delay: 6

- name: Start Radiusdesk Docker Container
  docker_container:
    name: inethi-radiusdesk
    image: keegan337/radiusdesk:4.0.2
    restart_policy: unless-stopped
    state: started
    env:
      PHP_INI_SCAN_DIR: ":/p/gd:/p/sqlite3"
      PHP.cgi.fix_pathinfo: "1"
      PHP_SELF: "/index.php"
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    labels:
      traefik.enable: "true"
      traefik.http.routers.radiusdesk.rule: "Host(`radiusdesk.{{ INETHI_LOCAL_DOMAIN }}`)"
      traefik.http.routers.radiusdesk.entrypoints: "websecure"
    networks:
      - name: "{{ BRIDGE }}"
