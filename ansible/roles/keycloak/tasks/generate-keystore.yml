---
- name: Debug vault variables
  debug:
    msg: |
      INETHI_LOCAL_DOMAIN: {{ INETHI_LOCAL_DOMAIN }}
      DATA_MOUNT: {{ DATA_MOUNT }}
      KEYSTORE_PASS: {{ KEYSTORE_PASS }}
      vault_keystore_password: {{ vault_keystore_password }}

- name: Check if vault file is accessible
  stat:
    path: "{{ playbook_dir }}/vault/production.yml"
  register: vault_file_check

- name: Debug vault file status
  debug:
    msg: |
      Vault file exists: {{ vault_file_check.stat.exists }}
      Vault file size: {{ vault_file_check.stat.size if vault_file_check.stat.exists else 'N/A' }}
      Vault file path: {{ playbook_dir }}/vault/production.yml

- name: Check if acme.json exists and has certificates
  stat:
    path: "{{ DATA_MOUNT }}/traefik/letsencrypt/acme.json"
  register: acme_file_check

- name: Debug acme.json status
  debug:
    msg: |
      ACME file exists: {{ acme_file_check.stat.exists }}
      ACME file size: {{ acme_file_check.stat.size if acme_file_check.stat.exists else 'N/A' }}

- name: Check if certificates exist in acme.json
  shell: |
    if [ -f "{{ DATA_MOUNT }}/traefik/letsencrypt/acme.json" ]; then
      # Check if letsencrypt.Certificates exists and is not null
      if jq -e '.letsencrypt.Certificates' "{{ DATA_MOUNT }}/traefik/letsencrypt/acme.json" > /dev/null 2>&1; then
        # Check if there are any certificates for our domain
        jq -r '.letsencrypt.Certificates[]? | select(.domain.main == "{{ INETHI_LOCAL_DOMAIN }}") | .domain.main' "{{ DATA_MOUNT }}/traefik/letsencrypt/acme.json" 2>/dev/null || echo "No certificates found for domain"
      else
        echo "No certificates section found"
      fi
    else
      echo "ACME file not found"
    fi
  register: certificate_check
  args:
    executable: /bin/bash
  become: true

- name: Debug certificate check
  debug:
    msg: "Certificate check result: {{ certificate_check.stdout }}"

- name: Debug acme.json structure
  shell: |
    if [ -f "{{ DATA_MOUNT }}/traefik/letsencrypt/acme.json" ]; then
      echo "ACME file structure:"
      jq -r 'keys' "{{ DATA_MOUNT }}/traefik/letsencrypt/acme.json" 2>/dev/null || echo "Invalid JSON"
      echo "Letsencrypt section:"
      jq -r '.letsencrypt | keys' "{{ DATA_MOUNT }}/traefik/letsencrypt/acme.json" 2>/dev/null || echo "No letsencrypt section"
    fi
  register: acme_structure
  args:
    executable: /bin/bash
  become: true

- name: Debug acme structure
  debug:
    msg: "{{ acme_structure.stdout }}"

- name: Extract certificate and key from acme.json
  shell: |
    jq -r '.letsencrypt.Certificates[] | select(.domain.main == "{{ INETHI_LOCAL_DOMAIN }}") | .certificate' "{{ DATA_MOUNT }}/traefik/letsencrypt/acme.json" | base64 -d > "{{ DATA_MOUNT }}/keycloak/certs/cert.pem"
    jq -r '.letsencrypt.Certificates[] | select(.domain.main == "{{ INETHI_LOCAL_DOMAIN }}") | .key' "{{ DATA_MOUNT }}/traefik/letsencrypt/acme.json" | base64 -d > "{{ DATA_MOUNT }}/keycloak/certs/privkey.pem"
  args:
    executable: /bin/bash
  become: true
  when: certificate_check.stdout is search(INETHI_LOCAL_DOMAIN)

- name: Set correct permissions on certificate files
  file:
    path: "{{ DATA_MOUNT }}/keycloak/certs/{{ item }}"
    mode: "0600"
    owner: root
    group: root
  loop:
    - cert.pem
    - privkey.pem
  become: true
  when: certificate_check.stdout is search(INETHI_LOCAL_DOMAIN)

- name: Fail if certificates are not available
  fail:
    msg: |
      SSL certificates are not available for domain {{ INETHI_LOCAL_DOMAIN }}.

      Current status: {{ certificate_check.stdout }}

      Please ensure Traefik is running and has generated certificates:
      1. Run Traefik setup first: python3 main.py --services traefik
      2. Wait for Let's Encrypt to generate certificates (may take a few minutes)
      3. Check that the domain {{ INETHI_LOCAL_DOMAIN }} is accessible
      4. Then run Keycloak again

      You can also check the ACME file structure manually:
      cat {{ DATA_MOUNT }}/traefik/letsencrypt/acme.json
  when: certificate_check.stdout is not search(INETHI_LOCAL_DOMAIN)

- name: Check certificate files exist and have content
  stat:
    path: "{{ DATA_MOUNT }}/keycloak/certs/{{ item }}"
  register: cert_file_check
  loop:
    - cert.pem
    - privkey.pem

- name: Debug certificate file information
  debug:
    msg: "File {{ item.item }} exists: {{ item.stat.exists }}, size: {{ item.stat.size if item.stat.exists else 'N/A' }}"
  loop: "{{ cert_file_check.results }}"

- name: Generate keystore from certificate and key
  shell: |
    CERT_DIR="{{ DATA_MOUNT }}/keycloak/certs"
    # Check if files exist and have content
    if [ ! -s "{{ DATA_MOUNT }}/keycloak/certs/cert.pem" ]; then
      echo "Certificate file is empty or missing"
      exit 1
    fi
    if [ ! -s "{{ DATA_MOUNT }}/keycloak/certs/privkey.pem" ]; then
      echo "Private key file is empty or missing"
      exit 1
    fi
    # Generate PKCS12 keystore
    openssl pkcs12 -export -in "{{ DATA_MOUNT }}/keycloak/certs/cert.pem" -inkey "{{ DATA_MOUNT }}/keycloak/certs/privkey.pem" -out "{{ DATA_MOUNT }}/keycloak/certs/keystore.p12" -name keycloak -password pass:{{ KEYSTORE_PASS }}
    # Import into JKS keystore
    keytool -importkeystore -deststorepass {{ KEYSTORE_PASS }} -destkeypass {{ KEYSTORE_PASS }} -destkeystore "{{ DATA_MOUNT }}/keycloak/certs/keystore.jks" -srckeystore "{{ DATA_MOUNT }}/keycloak/certs/keystore.p12" -srcstoretype PKCS12 -alias keycloak -srcstorepass {{ KEYSTORE_PASS }} -noprompt
  args:
    executable: /bin/bash
  become: true
