---
- name: Create Traefik dynamic configuration directory
  ansible.builtin.file:
    path: "{{ DATA_MOUNT }}/traefik/dynamic"
    state: directory
    mode: '0755'

- name: Create directory for traefik letsencrypt volume
  ansible.builtin.file:
    path: "{{ DATA_MOUNT }}/traefik/letsencrypt"
    state: directory
    mode: '0700'

- name: Pre-create empty acme.json (Traefik requires this on first start)
  ansible.builtin.file:
    path: "{{ DATA_MOUNT }}/traefik/letsencrypt/acme.json"
    state: touch
    mode: '0600'
    modification_time: preserve
    access_time: preserve

- name: Create directory for prometheus volume
  ansible.builtin.file:
    path: "{{ DATA_MOUNT }}/prometheus"
    state: directory
    mode: "0777"

- name: Create directory for grafana volume
  ansible.builtin.file:
    path: "{{ DATA_MOUNT }}/grafana"
    state: directory
    mode: "0777"

- name: Create subdirectory for prometheus volume
  ansible.builtin.file:
    path: "{{ DATA_MOUNT }}/prometheus/prometheus-config"
    state: directory

- name: Copy traefik toml to Server
  ansible.builtin.copy:
    src: files/traefik.toml
    dest: "{{ DATA_MOUNT }}/traefik"

- name: Copy prometheus yml to Server
  ansible.builtin.copy:
    src: files/prometheus.yml
    dest: "{{ DATA_MOUNT }}/prometheus/prometheus-config/"
    
- name: Render traefik-online.toml on the server
  template:
    src: traefik-online.toml.j2
    dest: "{{ DATA_MOUNT }}/traefik/traefik-online.toml"
    mode: '0644'
