---
# ---- ONLINE-only tasks ----
- name: Online-server setup
  when: INETHI_ONLINE | bool
  block:
    - import_tasks: pre-requisites-online.yml
    - import_tasks: traefik-container-online.yml

# ---- LOCAL-only tasks ----
- name: Local-server setup
  when: not (INETHI_ONLINE | bool)
  block:
    - import_tasks: pre-requisites.yml
    - import_tasks: traefik-container.yml

# ---- COMMON tasks ----
- name: Common services
  block:
    - import_tasks: grafana.yml
    - import_tasks: prometheus.yml
    - import_tasks: influxdb.yml
    
     

